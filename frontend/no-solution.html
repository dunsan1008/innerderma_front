<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=393, initial-scale=1">
<title>InnerDerma - 솔루션 미생성</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap');

body {
  font-family: 'Noto Sans KR', sans-serif;
  background: #f0f0f0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
}

.device {
  width: 393px;
  height: 852px;
  background: #fff;
  border-radius: 44px;
  overflow: hidden;
  position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}

/* ─── 헤더 (어두운 배경) ─── */
.header {
  position: absolute;
  top: 0;
  left: 0;
  width: 393px;
  height: 157px;
  background: #16161a;
  border-radius: 44px 44px 0 0;
  overflow: hidden;
}

/* 상태바 */
.statusbar {
  position: absolute;
  top: 12px;
  left: 21px;
  width: 351px;
  height: 21px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.statusbar-time {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  letter-spacing: -0.3px;
}

.statusbar-right {
  display: flex;
  align-items: center;
  gap: 6px;
}

.statusbar-right svg { display: block; }

/* 노치 */
.notch {
  position: absolute;
  top: -2px;
  left: 105px;
  width: 183px;
  height: 30px;
  background: #000;
  border-radius: 0 0 20px 20px;
}

/* 로고 줄 */
.logo-row {
  position: absolute;
  top: 49px;
  left: 0;
  width: 393px;
  height: 55px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 20px 16px 25px;
}

.logo {
  font-family: 'Palatino Linotype', Palatino, serif;
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  font-style: normal;
}

.header-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.header-actions svg { display: block; }

/* 주간 스트립 */
.week-strip {
  position: absolute;
  top: 117px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.day-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.day-label {
  font-size: 11px;
  font-weight: 400;
  color: rgba(255,255,255,0.5);
  line-height: 16.5px;
}

.day-chip {
  width: 32px;
  height: 32px;
  border-radius: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  line-height: 13px;
  color: #fff;
  position: relative;
}

.day-chip.record { background: #327145; }
.day-chip.today { background: #fff; color: rgba(0,0,0,0.7); }
.day-chip.empty { background: rgba(255,255,255,0.2); }
.day-chip.future { background: transparent; color: rgba(255,255,255,0.35); }

.day-chip.selected::after {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 100px;
  border: 2px solid #e8a33d;
}

/* ─── 세그먼트 ─── */
.segment {
  position: absolute;
  top: 157px;
  left: 20px;
  width: 353px;
  height: 52px;
  padding: 4px;
  background: #f2f2f7;
  border-radius: 14px;
  display: flex;
  gap: 4px;
}

.segment-btn {
  flex: 1;
  height: 44px;
  border-radius: 11px;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: transparent;
  position: relative;
}

.segment-btn.active {
  background: #1a1d23;
}

.segment-label {
  font-size: 13px;
  font-weight: 600;
  line-height: 13px;
  color: rgba(0,0,0,0.5);
}

.segment-btn.active .segment-label { color: #fff; }

.segment-sub {
  font-size: 10px;
  font-weight: 400;
  line-height: 10px;
  margin-top: 4px;
  color: rgba(0,0,0,0.3);
}

.segment-btn.active .segment-sub { color: rgba(255,255,255,0.5); }

/* ─── 미생성 안내 ─── */
.no-solution {
  position: absolute;
  top: 233px;
  left: 20px;
  right: 20px;
  background: rgba(177,177,177,0.15);
  border-radius: 16px;
  padding: 36px 24px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.no-solution-icon {
  width: 56px;
  height: 56px;
  border-radius: 18px;
  border: 1px solid #e5e9f0;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  font-weight: 700;
  color: #b0b6c0;
}

.no-solution-title {
  margin-top: 20px;
  font-size: 16px;
  font-weight: 700;
  line-height: 24px;
  color: #1a1d23;
  text-align: center;
}

.no-solution-date {
  margin-top: 6px;
  font-size: 13px;
  font-weight: 600;
  line-height: 19.5px;
  color: #6b7280;
  text-align: center;
}

.no-solution-desc {
  margin-top: 12px;
  font-size: 13px;
  font-weight: 400;
  line-height: 20px;
  color: #7a7e84;
  text-align: center;
}

/* ─── 하단 탭바 ─── */
.tabbar {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 393px;
  height: 96px;
}

.tabbar-container {
  position: absolute;
  left: 0;
  top: 10px;
  width: 393px;
  height: 86px;
  background: #fff;
  border-top: 0.667px solid #e5e9f0;
}

.tabbar-home {
  position: absolute;
  left: 60px;
  top: 18.33px;
  width: 28px;
  height: 26px;
  color: #000;
}

.tabbar-bag {
  position: absolute;
  left: 305px;
  top: 14.33px;
  width: 26px;
  height: 30px;
  color: #C0C0C0;
}

.tabbar-camera {
  position: absolute;
  left: 162px;
  top: 0;
  width: 68px;
  height: 68px;
}
</style>
</head>
<body>
<div class="device">

  <!-- 헤더 -->
  <div class="header">
    <!-- 노치 -->
    <div class="notch"></div>

    <!-- 상태바 -->
    <div class="statusbar">
      <span class="statusbar-time">9:41</span>
      <div class="statusbar-right">
        <!-- 신호 -->
        <svg width="17" height="12" viewBox="0 0 17 12" fill="none"><rect x="0" y="8" width="3" height="4" rx="0.5" fill="#fff"/><rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#fff"/><rect x="9" y="2" width="3" height="10" rx="0.5" fill="#fff"/><rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#fff"/></svg>
        <!-- 와이파이 -->
        <svg width="15" height="12" viewBox="0 0 15 12" fill="none"><path d="M7.5 10.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3z" fill="#fff"/><path d="M3.5 7.5a5.5 5.5 0 018 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M1 4.5a9 9 0 0113 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- 배터리 -->
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="2.5" stroke="rgba(255,255,255,0.35)"/><rect x="2" y="2" width="18" height="8" rx="1.5" fill="#fff"/><path d="M23 4v4a2 2 0 000-4z" fill="rgba(255,255,255,0.4)"/></svg>
      </div>
    </div>

    <!-- 로고 줄 -->
    <div class="logo-row">
      <span class="logo">InnerDerma</span>
      <div class="header-actions">
        <!-- 마이페이지 -->
        <svg width="19" height="19" viewBox="0 0 19 19" fill="none"><circle cx="9.5" cy="5.5" r="4" stroke="#fff" stroke-width="1.5"/><path d="M1.5 17.5c0-3.5 3.5-6 8-6s8 2.5 8 6" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
        <!-- 알림 -->
        <svg width="16" height="19" viewBox="0 0 16 19" fill="none"><path d="M8 1a5 5 0 00-5 5v4l-1.5 2.5h13L13 10V6a5 5 0 00-5-5z" stroke="#fff" stroke-width="1.5"/><path d="M6 16a2 2 0 004 0" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>
      </div>
    </div>

    <!-- 주간 스트립 -->
    <div class="week-strip">
      <div class="day-col">
        <span class="day-label">월</span>
        <div class="day-chip record">17</div>
      </div>
      <div class="day-col">
        <span class="day-label">화</span>
        <div class="day-chip today">18</div>
      </div>
      <div class="day-col">
        <span class="day-label">수</span>
        <div class="day-chip future">19</div>
      </div>
      <div class="day-col">
        <span class="day-label">목</span>
        <div class="day-chip future">20</div>
      </div>
      <div class="day-col">
        <span class="day-label">금</span>
        <div class="day-chip future">21</div>
      </div>
      <div class="day-col">
        <span class="day-label">토</span>
        <div class="day-chip future">22</div>
      </div>
      <div class="day-col">
        <span class="day-label">일</span>
        <div class="day-chip future selected">23</div>
      </div>
    </div>
  </div>

  <!-- 세그먼트 -->
  <div class="segment">
    <button class="segment-btn active">
      <span class="segment-label">오늘 밤</span>
      <span class="segment-sub">회복</span>
    </button>
    <button class="segment-btn">
      <span class="segment-label">내일 아침</span>
      <span class="segment-sub">보호</span>
    </button>
  </div>

  <!-- 미생성 안내 -->
  <div class="no-solution">
    <div class="no-solution-icon">?</div>
    <p class="no-solution-title">아직 솔루션이 생성되지 않았어요</p>
    <p class="no-solution-date">2026년 8월 23일 일요일</p>
    <p class="no-solution-desc">
      솔루션은 그날 촬영한 피부 상태를 분석해 만들어져요.<br>
      해당 날짜가 되면 그날의 케어 루틴을 확인할 수 있어요.
    </p>
  </div>

  <!-- 하단 탭바 -->
  <div class="tabbar">
    <div class="tabbar-container">
      <!-- 홈 (활성=검정) -->
      <div class="tabbar-home">
        <svg width="25" height="26" viewBox="0 0 27 28" fill="none"><path d="M8.45 22.6H17.95M2.88 10.34s5.79-5.79 8.3-8.31c1.36-1.37 2.9-1.32 4.04-.18l7.72 7.67c2 1.87 3.06 3.54 3.06 6.4v5.92c0 1.54-.5 2.84-1.5 3.78s-2.31 1.41-3.82 1.41H5.77c-1.51 0-2.82-.47-3.82-1.41S.5 23.37.5 21.84v-5.93c0-2.86-.14-3.73 1.88-5.57z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <!-- 마켓 (비활성=회색) -->
      <div class="tabbar-bag">
        <svg width="26" height="30" viewBox="0 0 26.2 30.2" fill="none"><path d="M3.1 30.1c-.86 0-1.57-.26-2.14-.77C.39 28.82.1 28.18.1 27.41V9.46c0-.77.29-1.41.86-1.92.57-.51 1.29-.77 2.14-.77H6.6V5.93c0-1.62.63-3 1.9-4.13C9.76.67 11.29.1 13.1.1s3.34.57 4.6 1.7c1.26 1.13 1.9 2.51 1.9 4.13v.83h3.5c.85 0 1.57.26 2.14.77.57.51.86 1.16.86 1.92v17.95c0 .77-.29 1.41-.86 1.92-.57.51-1.29.77-2.14.77H3.1zm0-1.67h20c.28 0 .55-.11.79-.32.24-.21.36-.45.36-.7V9.46c0-.26-.12-.49-.36-.71-.24-.21-.51-.32-.79-.32H19.6v4.17c0 .24-.09.44-.27.6-.18.16-.4.24-.66.24-.27 0-.49-.08-.66-.24-.18-.16-.27-.36-.27-.6V8.43H8.46v4.17c0 .24-.09.44-.27.6-.18.16-.4.24-.66.24-.27 0-.49-.08-.66-.24-.18-.16-.27-.36-.27-.6V8.43H3.1c-.29 0-.55.11-.79.32-.24.21-.36.45-.36.71v17.95c0 .26.12.49.36.71.24.21.51.32.79.32m5.36-21.67h9.29V5.93c0-1.17-.45-2.16-1.34-2.96-.9-.8-2-1.2-3.31-1.2s-2.41.4-3.3 1.2c-.9.8-1.34 1.79-1.34 2.96v.83z" fill="currentColor"/></svg>
      </div>
    </div>
    <!-- 촬영 버튼 -->
    <div class="tabbar-camera">
      <svg width="68" height="68" viewBox="0 0 68 68" fill="none">
        <circle cx="34" cy="34" r="34" fill="#000"/>
        <circle cx="34" cy="34" r="20" stroke="#fff" stroke-width="2" fill="none"/>
        <circle cx="34" cy="28" r="3" fill="#fff"/>
        <rect x="26" y="30" width="16" height="12" rx="2" stroke="#fff" stroke-width="2" fill="none"/>
      </svg>
    </div>
  </div>

</div>
</body>
</html>
